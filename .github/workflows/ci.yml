name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-jvm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build JVM artifact
        run: mvn clean package -q

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar

  build-native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build native executable
        run: |
          mvn clean package \
            -Pnative \
            -DskipTests \
            -Dquarkus.native.container-build=true

      - name: Upload native executable
        uses: actions/upload-artifact@v4
        with:
          name: native-artifact
          path: target/*-runner