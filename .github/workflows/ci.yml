name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

jobs:
  build-jvm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build JVM artifact
        run: mvn clean package -q

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: |
            target/*-runner.jar
            target/quarkus-app/**

  build-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Native-image support is currently more stable on Java 21.
      # We intentionally build the GraalVM native executable with JDK 21
      # to maximize Linux compatibility and avoid newer GLIBC requirements.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build native executable
        run: |
          mvn clean package \
            -Pnative \
            -DskipTests \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi8-quarkus-mandrel-builder-image:jdk-21

      - name: Verify GLIBC requirements
        run: |
          echo "Required GLIBC versions:"
          strings target/*-runner | grep GLIBC_ | sort -u || true

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-artifact
          path: |
            target/*-runner

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-jvm
      - build-native

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/jar-artifact/*
            artifacts/native-artifact/*