<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error – JAR Comparator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 60% 0%, #1e1b4b 0%, #0f172a 60%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      padding: 2rem 1rem;
    }
    .error-card {
      width: 100%; max-width: 480px;
      background: #fff; border-radius: 20px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5);
      overflow: hidden; text-align: center;
    }
    .error-hero {
      background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 100%);
      padding: 2.5rem 2rem 2rem;
    }
    .error-icon {
      width: 64px; height: 64px; border-radius: 50%;
      background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; font-size: 2rem; color: #fff;
    }
    .error-hero h1 { font-size: 1.25rem; font-weight: 700; color: #fff; margin: 0; }
    .error-body { padding: 2rem; }
    .error-message {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px;
      padding: .875rem 1rem; color: #991b1b; font-size: .875rem;
      text-align: left; line-height: 1.6; margin-bottom: 1.5rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      word-break: break-word;
    }
    .btn-home {
      display: inline-flex; align-items: center; gap: .5rem;
      background: linear-gradient(135deg, #4338ca, #6366f1);
      color: #fff; text-decoration: none;
      border-radius: 10px; padding: .7rem 1.5rem;
      font-weight: 600; font-size: .9rem;
      transition: opacity .15s, transform .1s;
      box-shadow: 0 4px 14px rgba(99,102,241,.4);
    }
    .btn-home:hover { opacity: .9; transform: translateY(-1px); color: #fff; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-hero">
      <div class="error-icon">
        <i class="bi bi-exclamation-triangle-fill"></i>
      </div>
      <h1>Comparison failed</h1>
    </div>
    <div class="error-body">
      <div class="error-message">{message}</div>
      <a href="/" class="btn-home">
        <i class="bi bi-arrow-left"></i>Try again
      </a>
    </div>
  </div>
</body>
</html>
