<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JAR Comparator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --brand: #6366f1; --brand-dark: #4338ca; }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%; overflow: hidden;
    }
    body {
      background: radial-gradient(ellipse at 60% 0%, #1e1b4b 0%, #0f172a 60%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      margin: 0; padding: 1rem;
    }

    .main-card {
      width: 100%; max-width: 520px;
      background: rgba(255,255,255,.06);
      border-radius: 20px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.1);
      overflow: hidden;
    }

    /* ── compact hero ── */
    .card-hero {
      background: linear-gradient(135deg, var(--brand-dark) 0%, #6366f1 55%, #818cf8 100%);
      padding: 1rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
      position: relative; overflow: hidden;
    }
    .card-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .app-icon {
      width: 42px; height: 42px; flex-shrink: 0;
      background: rgba(255,255,255,.18);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.35rem; color: #fff;
      border: 1px solid rgba(255,255,255,.25);
    }
    .hero-text h1 { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0 0 .15rem; }
    .hero-text p  { font-size: .76rem; color: rgba(255,255,255,.75); margin: 0; line-height: 1.4; }

    /* ── form body ── */
    .card-body-form { padding: 1.25rem 1.5rem 1.5rem; }

    .form-label {
      font-weight: 600; font-size: .75rem;
      color: rgba(255,255,255,.7); margin-bottom: .3rem;
      text-transform: uppercase; letter-spacing: .04em;
      display: block;
    }
    .form-label i { opacity: .5; }

    .form-control, .form-select {
      border-radius: 9px;
      border: 1.5px solid rgba(255,255,255,.12);
      padding: .55rem .8rem;
      font-size: .875rem;
      transition: border-color .15s, box-shadow .15s;
      background: rgba(15,23,42,.45);
      color: #e2e8f0;
      width: 100%;
    }
    .form-control::placeholder { color: rgba(255,255,255,.25); }
    .form-control:focus, .form-select:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(99,102,241,.2);
      background: rgba(15,23,42,.65);
      color: #fff;
      outline: none;
    }
    .form-select option { background: #1e1b4b; color: #e2e8f0; }
    .form-control.font-monospace { font-size: .8rem; }

    /* side-by-side version inputs */
    .version-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: .5rem;
      margin-bottom: .875rem;
    }
    .version-arrow {
      color: rgba(255,255,255,.35); font-size: .85rem;
      padding-bottom: .65rem; line-height: 1;
    }

    .form-check-input { background-color: rgba(15,23,42,.45); border-color: rgba(255,255,255,.2); }
    .form-check-input:checked { background-color: var(--brand); border-color: var(--brand); }
    .form-check-label { font-size: .84rem; color: rgba(255,255,255,.65); }

    .btn-compare {
      background: linear-gradient(135deg, var(--brand-dark), var(--brand));
      border: none; color: #fff; border-radius: 9px;
      padding: .7rem; font-weight: 600; font-size: .9rem;
      width: 100%;
      transition: opacity .15s, transform .1s, box-shadow .15s;
      box-shadow: 0 4px 14px rgba(99,102,241,.38);
      letter-spacing: .01em;
      cursor: pointer;
    }
    .btn-compare:hover  { opacity: .92; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,.44); color: #fff; }
    .btn-compare:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(99,102,241,.3); }

    /* ── overlay ── */
    #overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(15,23,42,.75); z-index: 9999;
      align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
    }
    #overlay.show { display: flex; }
    .overlay-card {
      background: #fff; border-radius: 18px;
      padding: 2.25rem 3rem; text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,.4);
    }
    .spinner-ring {
      width: 44px; height: 44px;
      border: 3px solid #e5e7eb;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      margin: 0 auto 1.1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-card .title { font-weight: 600; color: #111827; margin-bottom: .3rem; font-size: .95rem; }
    .overlay-card .sub   { font-size: .78rem; color: #9ca3af; margin: 0; }
  </style>
</head>
<body>
  <div id="overlay" role="status" aria-live="polite">
    <div class="overlay-card">
      <div class="spinner-ring"></div>
      <p class="title">Running comparison…</p>
      <p class="sub">Downloading JARs and analysing API changes</p>
    </div>
  </div>

  <div class="main-card">
    <div class="card-hero">
      <div class="app-icon"><i class="bi bi-boxes"></i></div>
      <div class="hero-text">
        <h1>JAR Comparator</h1>
        <p>Binary &amp; source API compatibility between Maven artifact versions</p>
      </div>
    </div>
    <div class="card-body-form">
      <form id="compare-form">

        <div class="mb-3">
          <label class="form-label" for="artifact">
            <i class="bi bi-boxes me-1"></i>Artifact
          </label>
          <input class="form-control font-monospace" id="artifact"
                 placeholder="com.google.guava:guava" required autocomplete="off" spellcheck="false">
        </div>

        <div class="version-row">
          <div>
            <label class="form-label" for="oldVersion"><i class="bi bi-archive me-1"></i>Old version</label>
            <input class="form-control font-monospace" id="oldVersion"
                   placeholder="31.0-jre" required autocomplete="off" spellcheck="false">
          </div>
          <div class="version-arrow"><i class="bi bi-arrow-right"></i></div>
          <div>
            <label class="form-label" for="newVersion"><i class="bi bi-archive-fill me-1"></i>New version</label>
            <input class="form-control font-monospace" id="newVersion"
                   placeholder="32.0-jre" required autocomplete="off" spellcheck="false">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="accessModifier">
            <i class="bi bi-shield-lock me-1"></i>Access modifier
          </label>
          <select class="form-select" id="accessModifier">
            <option value="PUBLIC" selected>PUBLIC</option>
            <option value="PROTECTED">PROTECTED</option>
            <option value="PACKAGE">PACKAGE</option>
            <option value="PRIVATE">PRIVATE</option>
          </select>
        </div>

        <div class="mb-4 form-check">
          <input class="form-check-input" type="checkbox" id="onlyIncompatible">
          <label class="form-check-label" for="onlyIncompatible">Only show incompatible changes</label>
        </div>

        <button type="submit" class="btn-compare">
          <i class="bi bi-arrow-left-right me-2"></i>Compare JARs
        </button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      // Pre-fill artifact field if coming back from a report
      var params = new URLSearchParams(window.location.search);
      var prefill = params.get('artifact');
      if (prefill) document.getElementById('artifact').value = prefill;

      document.getElementById('artifact').addEventListener('input', function () {
        this.setCustomValidity('');
      });
      document.getElementById('newVersion').addEventListener('input', function () {
        this.setCustomValidity('');
      });

      document.getElementById('compare-form').addEventListener('submit', function (e) {
        e.preventDefault();

        var artifactVal = document.getElementById('artifact').value.trim();
        var colonIdx    = artifactVal.indexOf(':');
        var artifactEl  = document.getElementById('artifact');

        if (colonIdx <= 0 || colonIdx === artifactVal.length - 1 || artifactVal.indexOf(':', colonIdx + 1) !== -1) {
          artifactEl.setCustomValidity('Format must be groupId:artifactId (e.g. com.google.guava:guava)');
          artifactEl.reportValidity();
          return;
        }
        artifactEl.setCustomValidity('');

        var group     = artifactVal.substring(0, colonIdx);
        var art       = artifactVal.substring(colonIdx + 1);
        var oldVer    = document.getElementById('oldVersion').value.trim();
        var newVer    = document.getElementById('newVersion').value.trim();
        var newVerEl  = document.getElementById('newVersion');

        if (oldVer === newVer) {
          newVerEl.setCustomValidity('New version must differ from old version');
          newVerEl.reportValidity();
          return;
        }
        newVerEl.setCustomValidity('');

        var qs = new URLSearchParams({
          oldVersion:      oldVer,
          newVersion:      newVer,
          accessModifier:  document.getElementById('accessModifier').value,
          onlyIncompatible: document.getElementById('onlyIncompatible').checked ? 'true' : 'false'
        });

        document.getElementById('overlay').classList.add('show');
        window.location.href = '/' + encodeURIComponent(group) + '/' + encodeURIComponent(art) + '?' + qs.toString();
      });
    })();
  </script>
</body>
</html>
